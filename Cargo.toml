[package]
name = "nvov"
version = "0.1.0"
edition = "2021"
description = "Neoveg - editor de vídeo não-linear em Rust puro, com a semântica de edição do VEGAS Pro"
license = "MIT OR Apache-2.0"

[[bin]]
name = "nvov"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.15"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
rayon = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[lints.rust]
# AGENTS.md §0.3: unsafe proibido fora de módulos de fronteira FFI nomeados.
unsafe_code = "forbid"

[profile.dev]
opt-level = 1
# AGENTS.md §0.7: o hook de pânico e o isolamento por catch_unwind exigem unwind.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
