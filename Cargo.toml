[package]
name = "nvov"
version = "0.1.0"
edition = "2021"
description = "NVOV - editor de vÃ­deo nÃ£o-linear em Rust puro, inspirado no fluxo de trabalho do VEGAS Pro"
license = "MIT OR Apache-2.0"

[[bin]]
name = "nvov"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.15"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
rayon = "1"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
