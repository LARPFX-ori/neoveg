# Portões de qualidade do AGENTS.md §3.4, executados em todo pull request e push em main.
#
# Por quê: sem CI, um PR pode entrar com formatação quebrada, avisos do clippy
# (incluindo os lints anti-pânico de §0.9), testes falhando ou dependência com
# licença fora da lista SPDX permitida. Não remova um passo sem ler o motivo dele.
#
# Provisório: AGENTS.md (Regras da Casa, regra 11) pede que os workflows chamem
# `neoveg/common-actions`. Esse repositório ainda não existe; quando existir,
# troque estes passos pelos workflows reutilizáveis de lá.
#
# Windows, Linux (Ubuntu) e macOS.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    name: Portões (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # §3.4.1: formatação padrão do rustfmt.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # §3.4.4: licenças das dependências contra a lista SPDX permitida.
      # Barato, roda antes do build para falhar cedo.
      - name: Auditoria de licenças
        run: python tools/check_licenses.py

      # §3.4.2 e §0.9: avisos viram erro, incluindo unwrap/expect/panic em produção.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Fixtures de mídia e de AAF em target/fixtures/ (§3.4: geradas, nunca
      # commitadas). Por quê: sem elas, os testes que as usam (conversão de
      # MP4, oráculo ffprobe de áudio, importação de AAF) pulam e passam sem
      # testar nada. ffmpeg/ffprobe e pyaaf2 são só geradores e oráculos
      # externos de teste (§2.3): não são linkados nem empacotados.
      - name: Ferramentas das fixtures
        run: |
          choco install ffmpeg -y --no-progress
          python -m pip install pyaaf2==1.7.1

      - name: Gerar fixtures
        run: |
          python tools/gen_media_fixtures.py target/fixtures
          python tools/gen_aaf_fixtures.py target/fixtures

      # §3.4.3. Os testes do host .NET pulam sozinhos quando o runtime não existe.
      # --test-threads=1: os testes de janela do neoveg_ui (egui_kittest) derrubam
      # o processo com STATUS_ACCESS_VIOLATION quando rodam em paralelo no runner;
      # um por vez é também como o projeto roda localmente. Não remova sem
      # resolver essa falha em paralelo.
      - name: cargo test
        run: cargo test --workspace -- --test-threads=1

  # Os mesmos portões no Linux. Por quê: o Neoveg também é distribuído para
  # Linux (instalador e pacote portátil do build_installer.py), e código só do
  # Windows (`#[cfg(windows)]`) esconde avisos e erros que só aparecem aqui:
  # um import usado só no Windows já quebrou o clippy do Linux sem a CI ver.
  # ubuntu-latest (24.04, glibc 2.39) é a mesma base dos pacotes gerados.
  gates-linux:
    name: Portões (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Cabeçalhos para compilar: ALSA (cpal, via alsa-sys e pkg-config),
      # Wayland e xkbcommon (winit). Xvfb dá um servidor X aos testes que
      # abrem janela; o runner não tem tela.
      - name: Bibliotecas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libwayland-dev libxkbcommon-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # §3.4.1
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # §3.4.4
      - name: Auditoria de licenças
        run: python tools/check_licenses.py

      # §3.4.2 e §0.9
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Mesmo motivo do job do Windows: sem as fixtures, os testes que as usam
      # pulam e passam sem testar nada (§2.3: ffmpeg só como gerador/oráculo).
      - name: Ferramentas das fixtures
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install pyaaf2==1.7.1

      - name: Gerar fixtures
        run: |
          python tools/gen_media_fixtures.py target/fixtures
          python tools/gen_aaf_fixtures.py target/fixtures

      # §3.4.3. Um teste por vez, como no Windows e como o projeto roda
      # localmente; xvfb-run para os testes de janela.
      - name: cargo test
        run: xvfb-run -a cargo test --workspace -- --test-threads=1

  # Os mesmos portões no macOS. Por quê: o backend VideoToolbox/AudioToolbox
  # (`media/videotoolbox.rs`) só compila com `#[cfg(target_os = "macos")]`, e
  # sem este job ele nunca passou pelo clippy: um import não usado e uma função
  # com argumentos demais ficaram escondidos até o primeiro build num Mac.
  # macos-latest é Apple Silicon (aarch64-apple-darwin); o Mac de testes do
  # projeto é Intel (x86_64-apple-darwin), então os dois alvos ficam cobertos.
  gates-macos:
    name: Portões (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # §3.4.1
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # §3.4.4
      - name: Auditoria de licenças
        run: python tools/check_licenses.py

      # §3.4.2 e §0.9
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Mesmo motivo dos outros jobs: sem as fixtures, os testes que as usam
      # pulam e passam sem testar nada (§2.3: ffmpeg só como gerador/oráculo).
      - name: Ferramentas das fixtures
        run: |
          brew install ffmpeg
          python -m pip install pyaaf2==1.7.1

      - name: Gerar fixtures
        run: |
          python tools/gen_media_fixtures.py target/fixtures
          python tools/gen_aaf_fixtures.py target/fixtures

      # §3.4.3. Um teste por vez, como nos outros sistemas. O runner do macOS
      # tem sessão gráfica, então os testes de janela não precisam de Xvfb.
      - name: cargo test
        run: cargo test --workspace -- --test-threads=1
