[package]
name = "neoveg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neoveg - editor de vídeo não-linear em Rust puro com semântica VEGAS Pro"

[[bin]]
name = "neoveg"
path = "src/main.rs"

# Instalador próprio (Windows e Linux): setup com o pacote do programa anexado ao
# fim do executável. Montado por tools/build_installer.py.
[[bin]]
name = "neoveg-setup"
path = "src/setup/main.rs"

[dependencies]
neoveg_common.workspace = true
neoveg_engine.workspace = true
neoveg_scripting.workspace = true
neoveg_ui.workspace = true
anyhow.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
zip.workspace = true
rfd.workspace = true
# PNG do ícone gravado pelo instalador no Linux
image.workspace = true

[lints]
workspace = true
