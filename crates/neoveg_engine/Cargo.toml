[package]
name = "neoveg_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Motor de edição, mídia, composição de vídeo, áudio, renderização e tabela única de comandos do Neoveg"

[dependencies]
neoveg_common.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
ab_glyph.workspace = true
rayon.workspace = true
cpal.workspace = true
claxon.workspace = true
lewton.workspace = true
puremp3.workspace = true
fundsp.workspace = true
rubato.workspace = true
dasp.workspace = true
ebur128.workspace = true
cfb.workspace = true
uuid.workspace = true
libloading.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Media_MediaFoundation",
    "Win32_UI_WindowsAndMessaging",
] }
vst3.workspace = true

[lints.rust]
# AGENTS.md §0.3: unsafe proibido em todo o crate, exceto nos módulos de
# fronteira FFI isolados `media::mf`, `media::vaapi`, `media::videotoolbox`
# e `plugin_host` (hosts de plug-ins).
unsafe_code = "deny"
